<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verity Resource Hub</title>
<meta name="description" content="Initiatives, programs and giving from Verity Outreach Worship Center.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
  // Default is light. Only a saved choice from the toggle changes it (set before paint to avoid a flash).
  try {
    var saved = localStorage.getItem('vrh-theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
</script>

<style>
  :root {
    --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

    /* Light (default) */
    --bg: #F4F7F7;
    --card: #FFFFFF;
    --ink: #1B2A2D;
    --muted: #5A6B6E;
    --line: #DCE4E5;
    --accent: #2F6F8A;
    --accent-ink: #FFFFFF;
    --media: #E7EEF0;
    --impact-bg: #EAF2F5;
    --btn: #293C40;
    --btn-ink: #FFFFFF;
    --shadow: 0 1px 2px rgba(20, 40, 45, .06);
    --shadow-modal: 0 24px 60px rgba(15, 30, 35, .28);
    --backdrop: rgba(18, 32, 36, .55);
    --logo-filter: none;
    --logo-blend: multiply;
  }
  :root[data-theme="dark"] {
    --bg: #0E1618;
    --card: #152124;
    --ink: #E9F0F1;
    --muted: #9BAEB1;
    --line: #25363A;
    --accent: #7DB8CF;
    --accent-ink: #0E1618;
    --media: #1C2B2F;
    --impact-bg: #1A2C32;
    --btn: #E9F0F1;
    --btn-ink: #0E1618;
    --shadow: none;
    --shadow-modal: 0 24px 60px rgba(0, 0, 0, .55);
    --backdrop: rgba(0, 0, 0, .65);
    /* Logo is dark artwork on a white JPG/PNG: invert + keep hue, then screen away the black. */
    --logo-filter: invert(1) hue-rotate(180deg);
    --logo-blend: screen;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body:has(dialog[open]) { overflow: hidden; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* ---------- Header ---------- */
  .top {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 0;
  }
  .logo {
    display: block;
    width: 150px;
    height: auto;
    filter: var(--logo-filter);
    mix-blend-mode: var(--logo-blend);
  }
  .years {
    margin: 8px 0 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .years:empty { display: none; }

  .theme-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .theme-toggle svg { width: 20px; height: 20px; }
  .theme-toggle .i-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .i-sun { display: block; }
  :root[data-theme="dark"] .theme-toggle .i-moon { display: none; }

  /* ---------- Intro ---------- */
  main { max-width: 1120px; margin: 0 auto; padding: 0 20px 56px; }
  .intro { text-align: center; padding: 40px 0 32px; }
  .intro h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 4.2vw, 40px);
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .intro p { margin: 0 auto; max-width: 52ch; color: var(--muted); font-size: 17px; }
  .notice {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 14px;
    border-radius: 10px;
    background: var(--impact-bg);
    color: var(--muted);
    font-size: 13px;
  }
  .notice[hidden] { display: none; }

  /* ---------- Card grid ---------- */
  .grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 20px;
  }
  .card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 0;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
    cursor: pointer;
    transition: border-color .15s ease;
  }
  .card:hover { border-color: var(--accent); }

  .media {
    aspect-ratio: 16 / 10;
    background: var(--media);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .monogram {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--accent);
    opacity: .45;
  }

  .card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-title { margin: 0; font-size: 19px; font-weight: 650; line-height: 1.25; letter-spacing: -0.01em; }
  .card-desc { margin: 0; color: var(--muted); font-size: 15px; }

  .impact {
    margin: 0;
    padding: 12px 20px;
    background: var(--impact-bg);
    border-top: 1px solid var(--line);
    color: var(--accent);
    font-size: 14.5px;
    font-weight: 600;
  }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }

  /* ---------- Popup ---------- */
  dialog.modal {
    width: min(600px, calc(100vw - 32px));
    max-height: calc(100dvh - 32px);
    margin: auto;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--card);
    color: var(--ink);
    box-shadow: var(--shadow-modal);
    overflow: hidden;
  }
  dialog.modal::backdrop { background: var(--backdrop); }
  dialog.modal[open] { animation: pop .18s ease-out; }
  dialog.modal[open]::backdrop { animation: fade .18s ease-out; }
  @keyframes pop  { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .modal-scroll { max-height: calc(100dvh - 34px); overflow-y: auto; }
  .modal-media { aspect-ratio: 16 / 8; background: var(--media); overflow: hidden; }
  .modal-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-media[hidden] { display: none; }

  .close {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 1;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .close svg { width: 18px; height: 18px; }

  .modal-body { padding: 24px 28px 28px; }
  .modal-body h2 { margin: 0 44px 6px 0; font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
  .modal-impact {
    display: inline-block;
    margin: 4px 0 4px;
    padding: 6px 12px;
    border-radius: 10px;
    background: var(--impact-bg);
    color: var(--accent);
    font-size: 14.5px;
    font-weight: 600;
  }
  .modal-impact[hidden] { display: none; }
  .block { margin-top: 18px; }
  .block[hidden] { display: none; }
  .block h3 { margin: 0 0 4px; font-size: 15px; font-weight: 650; }
  .block p { margin: 0; color: var(--muted); white-space: pre-line; max-width: 62ch; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 22px;
    border-radius: 12px;
    font: inherit;
    font-weight: 600;
    text-decoration: none;
    background: var(--btn);
    color: var(--btn-ink);
  }
  .btn.donate { background: var(--accent); color: var(--accent-ink); }
  .soon { margin: 0; color: var(--muted); font-size: 15px; }

  /* ---------- Footer ---------- */
  footer { text-align: center; padding: 8px 20px 36px; color: var(--muted); font-size: 13px; }

  @media (max-width: 520px) {
    .modal-body { padding: 20px 20px 22px; }
    .modal-body h2 { font-size: 22px; }
    .btn { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    dialog.modal[open], dialog.modal[open]::backdrop { animation: none; }
    .card { transition: none; }
  }
</style>
</head>

<body>
  <header class="top">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <img class="logo" src="assets/vow-logo.png" alt="Verity Outreach Worship Center">
    <p class="years" id="years"></p>
  </header>

  <main>
    <section class="intro">
      <h1>Resource hub</h1>
      <p>Programs, learning and giving from Verity Outreach Worship Center. Select a card to learn more.</p>
      <span class="notice" id="notice" hidden>Showing sample cards. Connect Notion to load your own.</span>
    </section>

    <ul class="grid" id="grid" aria-busy="true"></ul>
  </main>

  <footer>2101 W Diamond St, Philadelphia, PA 19121</footer>

  <dialog class="modal" id="modal" aria-labelledby="mTitle">
    <button class="close" id="mClose" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="modal-scroll">
      <div class="modal-media" id="mMedia" hidden><img id="mImg" alt=""></div>
      <div class="modal-body">
        <h2 id="mTitle"></h2>
        <span class="modal-impact" id="mImpact" hidden></span>
        <div class="block" id="mSummaryBlock" hidden><h3>About this initiative</h3><p id="mSummary"></p></div>
        <div class="block" id="mLatestBlock" hidden><h3>Latest update</h3><p id="mLatest"></p></div>
        <div class="actions" id="mActions"></div>
      </div>
    </div>
  </dialog>

<script>
  /* ============ CONFIG ============ */
  // Year ministry began. Drives the "years in ministry" line under the logo. Set to null to hide it.
  const MINISTRY_START_YEAR = 2016;

  // Where the Notion-backed data comes from (see api/cards.js).
  const CARDS_ENDPOINT = '/api/cards';

  // Sample cards shown only when the endpoint isn't reachable (e.g. opening this file locally).
  const DEMO_CARDS = [
    { id: 'd1', title: 'iThirst Water Donations', image: '',
      description: 'Getting clean drinking water to neighbors who need it.',
      impact: '156 cases of water donated',
      summary: 'Sample text. Explain what the initiative does, who it serves and how people can take part.',
      latest: 'Sample text. Your most recent update goes here.', link: '#', donate: '#' },
    { id: 'd2', title: 'Verity Learning Center', image: 'assets/verity-learning-center.jpg',
      description: 'Learning programs that grow faith and practical skills.',
      impact: 'Impact summary goes here',
      summary: 'Sample text about the learning center.', latest: '', link: '#', donate: '' },
    { id: 'd3', title: 'Truth Bible Institute', image: '',
      description: 'Faith education for the community, opening fall 2026.',
      impact: 'Launching fall 2026',
      summary: 'Sample text about the institute.', latest: '', link: '#', donate: '' },
    { id: 'd4', title: 'Chess Not Checkers', image: '',
      description: 'Mentorship and ministry for men, built around cohorts.',
      impact: 'Impact summary goes here',
      summary: 'Sample text about the men\u2019s cohort.', latest: '', link: '#', donate: '' },
    { id: 'd5', title: 'Giving statement request', image: '',
      description: 'Request a statement of your giving for your records.',
      impact: '',
      summary: 'Sample text. Explain what is included in a statement and how long it takes.', latest: '', link: '#', donate: '' },
    { id: 'd6', title: 'Spiritual gifts analysis', image: '',
      description: 'Discover how you are wired to serve.',
      impact: 'In development',
      summary: 'A new app for spiritual gifts analysis. More details soon.', latest: '', link: '', donate: '' }
  ];

  /* ============ Theme toggle ============ */
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');

  function syncToggleLabel() {
    const dark = root.getAttribute('data-theme') === 'dark';
    toggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  toggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('vrh-theme', next); } catch (e) {}
    syncToggleLabel();
  });
  syncToggleLabel();

  /* ============ Years in ministry ============ */
  (function () {
    const el = document.getElementById('years');
    if (!MINISTRY_START_YEAR) return;
    const n = new Date().getFullYear() - MINISTRY_START_YEAR;
    if (n > 0) el.textContent = n + (n === 1 ? ' year' : ' years') + ' in ministry';
  })();

  /* ============ Helpers ============ */
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function initials(title) {
    return title.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }

  /* ============ Cards ============ */
  const grid = document.getElementById('grid');
  let cards = [];

  function renderCards() {
    grid.replaceChildren();
    grid.removeAttribute('aria-busy');

    if (!cards.length) {
      grid.appendChild(el('li', 'empty', 'No initiatives are published yet. Check the Published box on a row in Notion to show it here.'));
      return;
    }

    cards.forEach((c) => {
      const li = el('li');
      const btn = el('button', 'card');
      btn.type = 'button';
      btn.setAttribute('aria-haspopup', 'dialog');

      const media = el('div', 'media');
      if (c.image) {
        const img = el('img');
        img.src = c.image;
        img.alt = '';
        img.loading = 'lazy';
        img.addEventListener('error', () => { media.replaceChildren(el('span', 'monogram', initials(c.title))); });
        media.appendChild(img);
      } else {
        media.appendChild(el('span', 'monogram', initials(c.title)));
      }

      const body = el('div', 'card-body');
      body.appendChild(el('h2', 'card-title', c.title));
      if (c.description) body.appendChild(el('p', 'card-desc', c.description));

      btn.append(media, body);
      if (c.impact) btn.appendChild(el('p', 'impact', c.impact));

      btn.addEventListener('click', () => openModal(c));
      li.appendChild(btn);
      grid.appendChild(li);
    });
  }

  /* ============ Popup ============ */
  const modal = document.getElementById('modal');
  const mMedia = document.getElementById('mMedia');
  const mImg = document.getElementById('mImg');
  const mTitle = document.getElementById('mTitle');
  const mImpact = document.getElementById('mImpact');
  const mSummaryBlock = document.getElementById('mSummaryBlock');
  const mSummary = document.getElementById('mSummary');
  const mLatestBlock = document.getElementById('mLatestBlock');
  const mLatest = document.getElementById('mLatest');
  const mActions = document.getElementById('mActions');

  function openModal(c) {
    mTitle.textContent = c.title;

    if (c.image) { mImg.src = c.image; mMedia.hidden = false; } else { mImg.removeAttribute('src'); mMedia.hidden = true; }
    mImg.onerror = () => { mMedia.hidden = true; };

    mImpact.textContent = c.impact || '';
    mImpact.hidden = !c.impact;

    const summary = c.summary || c.description || '';
    mSummary.textContent = summary;
    mSummaryBlock.hidden = !summary;

    mLatest.textContent = c.latest || '';
    mLatestBlock.hidden = !c.latest;

    mActions.replaceChildren();
    if (c.link) {
      const a = el('a', 'btn', 'Visit initiative');
      a.href = c.link; a.target = '_blank'; a.rel = 'noopener';
      mActions.appendChild(a);
    }
    if (c.donate) {
      const a = el('a', 'btn donate', 'Donate');
      a.href = c.donate; a.target = '_blank'; a.rel = 'noopener';
      mActions.appendChild(a);
    }
    if (!c.link && !c.donate) mActions.appendChild(el('p', 'soon', 'A page for this initiative is coming soon.'));

    modal.showModal();
    modal.querySelector('.modal-scroll').scrollTop = 0;
  }

  document.getElementById('mClose').addEventListener('click', () => modal.close());
  // Click on the dimmed area outside the popup closes it. Esc closes it natively.
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.close(); });

  /* ============ Load data ============ */
  async function load() {
    try {
      const res = await fetch(CARDS_ENDPOINT, { headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      cards = Array.isArray(data.cards) ? data.cards : [];
    } catch (err) {
      console.warn('Could not load cards from Notion, showing sample cards.', err);
      cards = DEMO_CARDS;
      document.getElementById('notice').hidden = false;
    }
    renderCards();
  }
  load();
</script>
</body>
</html>
